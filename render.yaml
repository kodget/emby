# Docker supplies LibreOffice/OCR at runtime. See docs/PRODUCTION_RECOVERY.md.
# Before applying: create the emby-production environment group with the EXISTING
# Neon DATABASE_URL, stable SECRET_KEY, Cloudinary and other integration settings.
# Do not create a replacement database. Review service costs before provisioning.
#
# COMBINED MODE: Runs Django web, Celery worker, and Celery Beat in a single free-tier
# web service. See docs/COMBINED_MODE.md for limitations and migration instructions.
services:
  - type: web
    name: emby-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py create_admin
    preDeployCommand: bash render_release.sh
    startCommand: bash render_start.sh combined
    rootDir: backend
    healthCheckPath: /health/
    envVars:
      - fromGroup: emby-production
      - key: REDIS_URL
        fromService:
          type: redis
          name: emby-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"

  - type: redis
    name: emby-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Allow all IPs (empty list = no restrictions on free tier)
